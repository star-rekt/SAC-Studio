appId: com.steepandcheap.sac-studio
productName: SAC Studio
asar: true
directories:
  output: desktop-release
files:
  - package.json
  - desktop/**
  - dist/**
  - dist-desktop/**
  - '!**/*.map'
extraResources:
  - from: plugin
    to: figma-plugin
    filter:
      - manifest.json
      - dist/**
mac:
  category: public.app-category.graphics-design
  identity: null
  target:
    - pkg
pkg:
  installLocation: /Applications
  allowAnywhere: false
  allowCurrentUserHome: true
  allowRootDirectory: true
  isRelocatable: false
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
